<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#020617"/>

  <!-- Stylized geometric "K" — bold strokes, rounded caps -->
  <!-- Vertical stem -->
  <line x1="60" y1="40" x2="60" y2="160" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>

  <!-- Upper diagonal arm — curves like a chipmunk tail -->
  <path d="M60 68 Q 60 60, 72 58 L 128 40" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>

  <!-- Lower diagonal arm -->
  <path d="M60 128 Q 60 140, 76 142 L 134 158" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>

  <!-- Acorn — subtle squirrel reference -->
  <!-- Nut body -->
  <ellipse cx="140" cy="42" rx="8" ry="7" fill="#fbbf24" opacity="0.9"/>
  <!-- Nut cap -->
  <path d="M128 41 Q 140 35, 152 41" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Cap lines -->
  <line x1="133" y1="39" x2="134.5" y2="37" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="38" x2="140" y2="36.5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="147" y1="39" x2="145.5" y2="37" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tiny stem -->
  <line x1="140" y1="35" x2="140" y2="30" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle amber accent dot -->
  <circle cx="128" cy="158" r="3" fill="#fbbf24" opacity="0.5"/>
</svg>
